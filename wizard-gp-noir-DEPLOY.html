<!-- AIGUILLEUR : DESKTOP = ancien configurateur a etapes (inline, meme 3D) ; MOBILE = nouveau proto plein ecran. L'ancien wizard est dans wizard-gp-noir-MODAL-backup.html. -->
<script>
(function(){
  if(window.__cbProtoInit) return; window.__cbProtoInit=1;
  try{ if(window.self!==window.top) return; }catch(e){ return; }   /* éditeur / preview GemPages (iframe) : on ne touche pas */

  /* ---- DESKTOP : on sert l'ancien configurateur à étapes (inline), même 3D ---- */
  try{
    if(window.matchMedia && window.matchMedia('(min-width: 900px)').matches){
      var MODAL='https://jchomow-cpu.github.io/climbox-3d/wizard-gp-noir-MODAL-backup.html?v='+Math.floor(Date.now()/60000);
      var host=document.getElementById('cbw-host'); if(!host){ host=document.createElement('div'); host.id='cbw-host'; document.body.appendChild(host); }
      var runW=function(html){
        var tmp=document.createElement('div'); tmp.innerHTML=html;
        var scripts=[].slice.call(tmp.querySelectorAll('script'));
        scripts.forEach(function(s){ if(s.parentNode) s.parentNode.removeChild(s); });
        while(tmp.firstChild){ host.appendChild(tmp.firstChild); }
        scripts.forEach(function(old){ var s=document.createElement('script'); for(var i=0;i<old.attributes.length;i++){ s.setAttribute(old.attributes[i].name, old.attributes[i].value); } s.textContent=old.textContent; document.body.appendChild(s); });
      };
      fetch(MODAL,{cache:'no-store'}).then(function(r){return r.text();}).then(runW).catch(function(e){ console.warn('[CBW] desktop wizard load failed', e); });
      return;
    }
  }catch(e){}

  /* ---- MOBILE : nouveau proto plein écran (panier Shopify réel) ---- */
  var PROTO='https://jchomow-cpu.github.io/climbox-3d/proto-configurateur.html?base=117.95&viewer=clim-box-3d-viewer-noir.html&v='+Math.floor(Date.now()/60000);
  var BASE_VARIANT='52522778100045', SUPP='52316783313229', DECOUPE='53962214506829', LOCK='54268144681293';
  var LABEL='Configurer mon cache sur mesure', ov=null;
  function open(){
    if(ov){ ov.style.display='block'; } else {
      ov=document.createElement('div'); ov.id='cbx-proto-ov';
      ov.style.cssText='position:fixed;inset:0;z-index:2147483600;background:#000';
      var f=document.createElement('iframe'); f.src=PROTO; f.setAttribute('allow','accelerometer;gyroscope');
      f.style.cssText='width:100%;height:100%;border:0;display:block';
      var x=document.createElement('button'); x.type='button'; x.setAttribute('aria-label','Fermer'); x.innerHTML='✕';
      x.style.cssText='position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:2147483601;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px;cursor:pointer';
      x.onclick=function(){ ov.style.display='none'; document.documentElement.style.overflow=''; };
      ov.appendChild(f); ov.appendChild(x); document.body.appendChild(ov);
    }
    document.documentElement.style.overflow='hidden';
  }
  window.cbOpenWizard=open;
  function getBtn(){ return document.querySelector('button.gp-button-base')
      || document.querySelector('form[action*="/cart/add"] button[type="submit"]')
      || document.querySelector('button[name="add"]'); }
  function wire(){ var b=getBtn(); if(!b) return; if(b.getAttribute('data-cbp')!=='1'){ b.setAttribute('data-cbp','1'); try{ b.textContent=LABEL; }catch(e){} } }
  setInterval(wire,600); wire();
  document.addEventListener('click', function(e){ var b=e.target&&e.target.closest?e.target.closest('[data-cbp="1"]'):null; if(b){ e.preventDefault(); e.stopPropagation(); open(); } }, true);
  function variantId(){ var el=document.querySelector('form[action*="/cart/add"] [name="id"]'); return el&&el.value?el.value:BASE_VARIANT; }
  window.addEventListener('message', function(ev){
    var d=ev.data; if(!d||d.cbType!=='cbx-addcart') return;
    var items=[{ id:Number(variantId()), quantity:1, properties:d.props||{} }];
    if(d.supp>0)     items.push({ id:Number(SUPP),    quantity:Number(d.supp),     properties:{"_type":"Supplément au cm","_lock_qty":"1"} });
    if(d.decoupes>0) items.push({ id:Number(DECOUPE), quantity:Number(d.decoupes), properties:{"_type":"Supplément découpe","_lock_qty":"1"} });
    if(d.lock)       items.push({ id:Number(LOCK),    quantity:1,                  properties:{"_type":"Serrure","_lock_qty":"1"} });
    fetch('/cart/add.js',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({items:items})})
      .then(function(r){ return r.text().then(function(t){ return {ok:r.ok,t:t}; }); })
      .then(function(res){ if(res.ok){ window.location.href='/cart'; } else { alert('Erreur ajout au panier'); console.warn(res.t); } })
      .catch(function(e){ alert('Erreur réseau panier'); console.warn(e); });
  });
})();
</script>
